name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true          # caches $GOPATH/pkg/mod and build cache

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  agent:
    name: PicoClaw build and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/shelley/go.mod
          cache-dependency-path: |
            go.sum
            agent/shelley/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # prepare.py decides which files are build products by a fixed list; a
      # tracked file it skips would silently miss every build and package.
      - name: Vendored Shelley tree matches the packaged source list
        run: |
          diff <(git ls-files agent/shelley | sed 's|^agent/shelley/||' | sort) \
               <(cd agent && python3 -c 'from prepare import source_files; print("\n".join(r for r, _ in source_files()))' | sort)
      - name: Build agent with preserved UI
        run: make agent
      # Ahead of the upstream suite: these exercise the gateway/agent contract
      # this repo owns, and they must report even when an upstream test the
      # PicoClaw overlay already breaks fails the job.
      - name: Test complete gateway and agent path
        run: SVKEXE_TEST_AGENT_BINARY="$PWD/bin/picoclaw" go test ./internal/llmproxy -run TestPicoClaw -v
      - name: Build and test standalone source package outside repository
        env:
          AGENT_APP_NAME: Standalone CI
        run: |
          make -C agent package
          package_dir="$(mktemp -d "$RUNNER_TEMP/picoclaw-package.XXXXXX")"
          tar -xzf agent/bin/picoclaw-agent-source.tar.gz -C "$package_dir"
          make -C "$package_dir/agent" build
          make -C "$package_dir/agent" smoke
      - name: Test agent compatibility
        run: make test-agent

  installation:
    name: Installation script contracts and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh agent/*.sh; do bash -n "$script"; done
      - name: Exercise installation failure paths without changing the host
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
      - name: Validate Compose with a custom domain
        env:
          DOMAIN: gateway.example.test
          ACME_EMAIL: admin@example.test
          CLOUDFLARE_API_TOKEN: test-placeholder
          GATEWAY_ENC_KEY: test-placeholder
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: test-placeholder
          LLM_INTERNAL_TOKEN: test-placeholder
        run: docker compose -f deploy/docker-compose.yml config --quiet
