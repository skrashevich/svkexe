name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true          # caches $GOPATH/pkg/mod and build cache

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  agent:
    name: PicoClaw build and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod.lock
          cache-dependency-path: |
            go.sum
            agent/go.sum.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build agent with preserved UI
        run: make agent
      - name: Test agent compatibility
        run: make test-agent
      - name: Test complete gateway and agent path
        run: SVKEXE_TEST_AGENT_BINARY="$PWD/bin/picoclaw" go test ./internal/llmproxy -run TestPicoClawThroughGateway -v
