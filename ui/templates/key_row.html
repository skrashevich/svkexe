{{define "key_row"}}
<tr id="key-row-{{.Provider}}">
    <td class="cell-name">{{.Provider}}</td>
    <td><div>{{.BaseURL}}</div><div class="cell-muted">{{.Models}}</div></td>
    <td class="cell-mono">{{.Masked}}</td>
    <td class="cell-muted">{{formatTime .CreatedAt}}</td>
    <td class="cell-actions">
        <button class="btn btn-danger btn-sm"
            hx-delete="/dashboard/keys/{{.Provider}}"
            hx-target="#key-table-body"
            hx-swap="innerHTML"
            hx-confirm="Delete {{.Provider}} key?">
            Delete
        </button>
    </td>
</tr>
{{end}}

{{define "key_list"}}
{{range .}}{{template "key_row" .}}{{else}}
<tr id="keys-empty"><td colspan="5" style="padding:48px 16px; text-align:center;">No API keys saved yet.</td></tr>
{{end}}
{{end}}
